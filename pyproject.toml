[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pypokerlost"
version = "0.2.0"
description = "Asynchronous Python SDK for the Pokerlost JSON protocol"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pre-commit>=4.6.2,<5",
    "ruff>=0.16.4,<1",
    "typer>=0.16.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["pypokerlost"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
files = ["pypokerlost", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
