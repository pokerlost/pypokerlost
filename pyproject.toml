[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pypokerlost"
version = "0.3.0.dev0"
description = "Asynchronous Python SDK for the Pokerlost JSON protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
generator = ["typer>=0.16.0,<1"]

[project.scripts]
pypokerlost-generate = "pypokerlost_generator.__main__:main"

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "mypy>=2.3,<3",
    "pre-commit>=4.6.2,<5",
    "ruff>=0.16.4,<1",
    "typer>=0.16.0,<1",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[tool.hatch.build]
exclude = [
    ".aws", ".aws/**", ".agents", ".agents/**", ".codex", ".codex/**",
    ".serena", ".serena/**", ".local", ".local/**", "backups", "backups/**",
    ".env", ".env.*", "!.env.example",
    "/core.[0-9]*", "/.coverage", "/.coverage.*", ".vscode", ".vscode/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pypokerlost"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/generate_methods.py" = "pypokerlost_generator/__main__.py"
"scripts/__init__.py" = "pypokerlost_generator/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
markers = ["unit: isolated unit tests", "contract: public SDK contract tests"]

[tool.coverage.run]
branch = true
source = ["pypokerlost", "scripts"]
patch = ["subprocess"]

[tool.coverage.paths]
runtime = ["src/pypokerlost", "*/site-packages/pypokerlost"]

[tool.coverage.report]
fail_under = 0
precision = 2
show_missing = true

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/pypokerlost", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
