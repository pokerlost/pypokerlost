name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: make sync
      - run: make check
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: make sync
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.36.1
      - name: Canonical library artifacts
        id: artifacts
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=${{ github.repository_id }}-sdk-artifacts-linux-amd64-v1
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-sdk-artifacts-linux-amd64-v1
      - name: Installed wheel tests outside the source checkout
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/wheel" --python 3.14
          uv export --quiet --locked --all-groups --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" --requirement "$RUNNER_TEMP/requirements.txt"
          uv pip install --no-deps --python "$RUNNER_TEMP/wheel/bin/python" dist/*.whl
          mkdir "$RUNNER_TEMP/checks"
          cp -R tests scripts docs pyproject.toml README.md .gitignore "$RUNNER_TEMP/checks/"
          cd "$RUNNER_TEMP/checks"
          "$RUNNER_TEMP/wheel/bin/python" -c 'from pathlib import Path; import pypokerlost; assert "site-packages" in Path(pypokerlost.__file__).parts'
          "$RUNNER_TEMP/wheel/bin/python" -m pytest --import-mode=importlib --cov --cov-report=term-missing --cov-report=json --cov-report=xml
      - name: Cached installed-wheel test environment
        id: testImage
        if: ${{ always() && !cancelled() && steps.artifacts.outcome == 'success' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          tags: pypokerlost:test
          cache-from: type=gha,scope=${{ github.repository_id }}-sdk-test-linux-amd64-v1
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-sdk-test-linux-amd64-v1
      - name: Fresh installed-wheel container tests
        if: ${{ always() && !cancelled() && steps.testImage.outcome == 'success' }}
        run: |
          mkdir -p coverage/container
          docker run --rm --read-only --network none --tmpfs /tmp:rw,noexec,nosuid,size=128m --user "$(id -u):$(id -g)" --mount type=bind,source="$PWD/coverage/container",target=/checks/coverage pypokerlost:test
      - name: Built archives and installed-wheel coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            ${{ runner.temp }}/checks/coverage/
            coverage/container/
          if-no-files-found: error
          retention-days: 14

  required:
    if: always()
    needs: [verify, wheel]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source and installed-wheel gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert all(job["result"] == "success" for job in results.values()), results
          PY
