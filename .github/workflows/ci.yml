name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: make sync
      - run: make check
      - run: make build
      - name: Installed wheel import
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/wheel" --python 3.14
          uv export --quiet --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" --requirement "$RUNNER_TEMP/requirements.txt"
          uv pip install --no-deps --python "$RUNNER_TEMP/wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c 'from pypokerlost import PokerlostClient; from pypokerlost.methods import GetToken; print(PokerlostClient.__name__, GetToken.__name__)'
