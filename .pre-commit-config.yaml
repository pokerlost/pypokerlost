repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check from the project lock
        entry: uvx --from ruff==0.16.4 ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format from the project lock
        entry: uvx --from ruff==0.16.4 ruff format
        language: system
        types: [python]
      - id: documentation-policy
        name: documentation policy
        entry: uv run --no-project --with typer==0.27.3 python scripts/check_documentation.py
        language: system
        pass_filenames: false
        always_run: true
        files: \.md$
